name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'circuit'

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      matrix:
        target-hardware: [esp8266, esp32, esp32c3]

    steps:
      - name: Fix broken git submodule URL
        run: |
          git config --global url."https://github.com/eclipse-tinydtls/tinydtls.git".insteadOf "https://git.eclipse.org/r/tinydtls/org.eclipse.tinydtls"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. Build cho ESP8266 (Khép kín trong Docker từ build tới merge_bin)
      - name: Build and Merge for esp8266
        if: matrix.target-hardware == 'esp8266'
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:20.04 bash -c "
            export DEBIAN_FRONTEND=noninteractive && \
            apt-get update && \
            apt-get install -y gcc git wget curl make cmake libncurses-dev flex bison python python-setuptools ninja-build python3 python3-pip && \
            curl https://bootstrap.pypa.io/pip/2.7/get-pip.py -o get-pip.py && \
            python get-pip.py && \
            python -m pip install --upgrade 'pip<21.0' 'setuptools<44.0' && \
            python -m pip install 'pyelftools<=0.30' 'future==0.18.2' && \
            wget https://dl.espressif.com/dl/xtensa-lx106-elf-linux64-1.22.0-100-ge567ec7-5.2.0.tar.gz && \
            tar -xzf ./xtensa-lx106-elf-linux64-1.22.0-100-ge567ec7-5.2.0.tar.gz && \
            python -m pip install --user --no-build-isolation -r ./ESP8266_RTOS_SDK/requirements.txt || true && \
            export IDF_PATH=/workspace/ESP8266_RTOS_SDK && \
            export PATH=\"\$PATH:/workspace/xtensa-lx106-elf/bin\" && \
            python ./idf.py fullclean && \
            python ./idf.py build && \
            python3 -m pip install 'esptool<5.0' && \
            python3 -m esptool --chip esp8266 merge_bin -o build/wireless_esp_dap_full.bin 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/wireless_esp_dap.bin && \
            mv build/wireless_esp_dap.bin build/wireless_esp_dap_app.bin
          "

      # 2. Build cho ESP32 & ESP32-C3 qua Action chính hãng (Tự động hóa hoàn toàn các tool cũ)
      - name: Build for esp32 / esp32c3
        if: matrix.target-hardware != 'esp8266'
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v4.4.2
          target: ${{ matrix.target-hardware }}
          path: './'
          command: |
            idf.py build
            pip install esptool
            esptool.py --chip ${{ matrix.target-hardware }} merge_bin -o build/wireless_esp_dap_full.bin 0x1000 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/wireless_esp_dap.bin
            mv build/wireless_esp_dap.bin build/wireless_esp_dap_app.bin
          cache: true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware_${{ matrix.target-hardware }}
          path: |
            build/wireless_esp_dap_full.bin
            build/wireless_esp_dap_app.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin